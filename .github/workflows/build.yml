name: Build Arabic Geyser Fix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package -B

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-geyser-fix
          path: target/arabic-geyser-fix-*.jar
          retention-days: 30
